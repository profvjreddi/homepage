<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Context-state and effect taxonomy for managed executions</title>
  <desc id="desc">A split-plane diagram. Context state forms a working-set hierarchy with capacity increasing downward and control improving upward, while effectful I/O carries increasing latency, risk, and irreversibility.</desc>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#4F8762"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#A06161"/>
    </marker>
    <style>
      .plane { fill: #FFFFFF; stroke: #CCD4DD; stroke-width: 1.2; }
      .memory { fill: #E6F2EA; stroke: #4F8762; stroke-width: 1.35; }
      .memoryAlt { fill: #F3F8F4; stroke: #4F8762; stroke-width: 1.35; }
      .effect { fill: #F4DFDF; stroke: #A06161; stroke-width: 1.35; }
      .effectAlt { fill: #FAEDED; stroke: #A06161; stroke-width: 1.35; }
      .substrate { fill: #F0EBE4; stroke: #9B8E7E; stroke-width: 1.35; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #111111; }
      .title { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .sub { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #333333; }
      .axis { font-family: Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #4F8762; }
      .axisRed { font-family: Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #A06161; }
      .arrow { stroke: #4F8762; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .arrowRed { stroke: #A06161; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
      .divider { stroke: #D6DDE5; stroke-width: 1.1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="380" fill="#ffffff"/>

  <rect x="54" y="20" width="522" height="330" class="plane"/>
  <rect x="624" y="20" width="522" height="330" class="plane"/>
  <line x1="600" y1="20" x2="600" y2="350" class="divider"/>

  <text x="315" y="56" text-anchor="middle" class="label">Context State</text>
  <text x="885" y="56" text-anchor="middle" class="label">Effectful I/O</text>

  <g id="context-state">
    <rect x="210" y="86" width="210" height="36" class="memory"/>
    <text x="315" y="101" text-anchor="middle" class="title">Active Context</text>
    <text x="315" y="115" text-anchor="middle" class="sub">tokens visible now</text>

    <rect x="175" y="130" width="280" height="36" class="memoryAlt"/>
    <text x="315" y="145" text-anchor="middle" class="title">KV / Prefix Cache</text>
    <text x="315" y="159" text-anchor="middle" class="sub">derived, reusable, recomputable</text>

    <rect x="140" y="174" width="350" height="36" class="memory"/>
    <text x="315" y="189" text-anchor="middle" class="title">Working State</text>
    <text x="315" y="203" text-anchor="middle" class="sub">scratchpads, plans, partial results</text>

    <rect x="105" y="218" width="420" height="36" class="memoryAlt"/>
    <text x="315" y="233" text-anchor="middle" class="title">Semantic Memory</text>
    <text x="315" y="247" text-anchor="middle" class="sub">retrieval stores, summaries, episodes</text>

    <rect x="88" y="262" width="454" height="36" class="memory"/>
    <text x="315" y="277" text-anchor="middle" class="title">Artifacts and Logs</text>
    <text x="315" y="291" text-anchor="middle" class="sub">files, traces, checkpoints, evidence</text>

    <path d="M 74 90 L 74 296" class="arrow"/>
    <text x="74" y="337" text-anchor="start" class="axis">capacity, lifetime, sharing grow</text>

    <path d="M 556 296 L 556 90" class="arrow"/>
    <text x="556" y="337" text-anchor="end" class="axis">freshness and control improve</text>
  </g>

  <g id="effectful-io">
    <rect x="690" y="86" width="390" height="40" class="effect"/>
    <text x="885" y="103" text-anchor="middle" class="title">Tool Runtimes</text>
    <text x="885" y="119" text-anchor="middle" class="sub">code execution, browsers, shells, APIs</text>

    <rect x="690" y="145" width="390" height="40" class="effectAlt"/>
    <text x="885" y="162" text-anchor="middle" class="title">Services and Databases</text>
    <text x="885" y="178" text-anchor="middle" class="sub">external records, queues, workflows</text>

    <rect x="690" y="204" width="390" height="40" class="effect"/>
    <text x="885" y="221" text-anchor="middle" class="title">Human and Agent Peers</text>
    <text x="885" y="237" text-anchor="middle" class="sub">approvals, delegation, communication</text>

    <rect x="690" y="263" width="390" height="40" class="substrate"/>
    <text x="885" y="280" text-anchor="middle" class="title">Physical Environment</text>
    <text x="885" y="296" text-anchor="middle" class="sub">sensors, actuators, users, devices</text>

    <path d="M 1116 90 L 1116 301" class="arrowRed"/>
    <text x="1116" y="337" text-anchor="end" class="axisRed">latency, risk, irreversibility grow</text>
  </g>
</svg>
